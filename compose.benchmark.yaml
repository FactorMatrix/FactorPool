name: factorpool-benchmark
services:
  benchmark:
    image: ${FACTORPOOL_BENCH_IMAGE:?}
    entrypoint: [python3, /bench/tools/benchmark_core.py]
    network_mode: none
    read_only: true
    cpus: 1
    cpuset: ${FACTORPOOL_BENCH_CPU:-0}
    mem_limit: 4g
    tmpfs:
      - /tmp:size=512m
    volumes:
      - ./tools:/bench/tools:ro
      - ./tests:/bench/tests:ro
      - ./src/examples:/bench/src/examples:ro
      - ./build/performance:/bench/output
