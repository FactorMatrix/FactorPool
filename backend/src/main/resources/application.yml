server:
  port: 8080
  max-http-request-header-size: 16KB
spring:
  datasource:
    url: ${FACTORPOOL_DB_URL:jdbc:postgresql://db:5432/factorpool}
    username: factorpool
    password: ${FACTORPOOL_DB_PASSWORD}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-request-size: 256KB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
factorpool:
  max-concurrent: ${FACTORPOOL_MAX_CONCURRENT:1}
  timeout-seconds: ${FACTORPOOL_TIMEOUT_SECONDS:1800}
  lease-seconds: ${FACTORPOOL_LEASE_SECONDS:30}
  max-attempts: ${FACTORPOOL_MAX_ATTEMPTS:3}
  max-queued: ${FACTORPOOL_MAX_QUEUED:1000}
  internal-token: ${FACTORPOOL_INTERNAL_TOKEN}
  data-service-address: ${FACTORPOOL_DATA_SERVICE_ADDR:data-service:50051}
  data-timeout-seconds: ${FACTORPOOL_DATA_TIMEOUT_SECONDS:10}
