name: factorpool
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: factorpool
      POSTGRES_DB: factorpool
      POSTGRES_PASSWORD: ${FACTORPOOL_DB_PASSWORD:?run scripts/configure.py first}
    volumes:
      - ${FACTORPOOL_STATE_DIR:?}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorpool -d factorpool"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: factorpool/backend:${FACTORPOOL_RELEASE:?}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        FT_ENV_IMAGE: ${FT_ENV_IMAGE:-factortrader/platform:20261105-factortrader-48804c66-r1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      FACTORPOOL_DB_PASSWORD: ${FACTORPOOL_DB_PASSWORD}
      FACTORPOOL_MAX_CONCURRENT: ${FACTORPOOL_MAX_CONCURRENT:-1}
      FACTORPOOL_TIMEOUT_SECONDS: ${FACTORPOOL_TIMEOUT_SECONDS:-1800}
    volumes:
      - ${FACTORPOOL_STATE_DIR:?}/tasks:/data/tasks
    mem_limit: 4g
    cpus: 4
    stop_grace_period: 30s
  frontend:
    image: factorpool/frontend:${FACTORPOOL_FRONTEND_RELEASE:-${FACTORPOOL_RELEASE:?}}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FACTORPOOL_BIND_IP:-0.0.0.0}:${FACTORPOOL_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
  market-import:
    profiles: [tools]
    image: factorpool/backend:${FACTORPOOL_RELEASE:?}
    entrypoint: [python3, -m, factorpool.bundle_import]
    command: [--root, /data/bundle]
    environment:
      FACTORPOOL_DB_PASSWORD: ${FACTORPOOL_DB_PASSWORD}
    volumes:
      - ${FACTORPOOL_BUNDLE_ROOT:-/home/quant/colorful-data/quant_data/bundle}:/data/bundle:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 4g
    cpus: 4
