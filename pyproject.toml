[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "factorpool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.2.13"]
description = "Factor research using the pinned FactorTrader Indicator compiler and native Core"
[project.scripts]
factorpool = "factorpool.runner:main"
[tool.setuptools.packages.find]
where = ["src"]
